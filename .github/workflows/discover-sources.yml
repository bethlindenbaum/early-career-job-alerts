name: Discover company job feeds

on:
  schedule:
    - cron: '17 9 * * 1'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run sources:discover
      - run: npm run build
      - name: Publish discovered sources
        run: |
          if git diff --quiet -- data/sources.json public/source-coverage.json; then
            echo "No new official feeds discovered"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json public/source-coverage.json
          git commit -m "chore: discover official job feeds"
          git push
